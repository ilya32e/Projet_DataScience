services:
  streamlit:
    build: .
    container_name: retention_streamlit
    ports:
      - "8501:8501"
    volumes:
      - .:/app
    environment:
      - PYTHONUNBUFFERED=1
    command: streamlit run app/streamlit_app.py --server.port=8501 --server.address=0.0.0.0
    networks:
      - retention_network

  api:
    build: .
    container_name: retention_api
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    environment:
      - PYTHONUNBUFFERED=1
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - retention_network
    depends_on:
      - streamlit

networks:
  retention_network:
    driver: bridge
